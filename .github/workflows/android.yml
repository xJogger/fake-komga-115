name: Android APK preview

on:
  push:
    branches: ["feat/v2.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    if: github.ref == 'refs/heads/feat/v2.1'
    uses: ./.github/workflows/android-package.yml
    with:
      version-name: "2.1.0-preview"
      version-code: 2010000
