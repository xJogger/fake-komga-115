name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      android-version-name: ${{ steps.android-version.outputs.name }}
      android-version-code: ${{ steps.android-version.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - name: Require release notes before building
        run: test -s "docs/release-notes/${GITHUB_REF_NAME}.md"
      - name: Compute Android version
        id: android-version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^v(0|[1-9][0-9]{0,2})[.](0|[1-9][0-9]?)[.](0|[1-9][0-9]?)$ ]] || {
            echo "::error::Use a stable release tag vMAJOR.MINOR.PATCH"
            exit 1
          }
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          # Reserve codes below ...99 for previews of the same release.
          code=$((major * 1000000 + minor * 10000 + patch * 100 + 99))
          printf 'name=%s\ncode=%s\n' "${tag#v}" "${code}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable corepack
        run: corepack enable
      - name: Build built-in reader bundle
        run: bash scripts/build-reader.sh
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - uses: actions/upload-artifact@v7
        with:
          name: reader-dist
          path: internal/httpserver/static/reader_dist/
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: reader-dist
          path: internal/httpserver/static/reader_dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package="fake-komga-115_${tag}_${GOOS}_${GOARCH}"
          executable="fake-komga-115"
          if [[ "${GOOS}" == "windows" ]]; then
            executable="${executable}.exe"
          fi

          mkdir -p "dist/${package}"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X github.com/xJogger/fake-komga-115/internal/buildinfo.Version=${tag}" \
            -o "dist/${package}/${executable}" \
            ./cmd/server
          cp README.md LICENSE SECURITY.md AGENTS.md "dist/${package}/"
          cp web/reader/LICENSE "dist/${package}/LICENSE-Suwayomi-MPL-2.0.txt"
          mkdir -p "dist/${package}/docs/release-notes" "dist/${package}/web/reader"
          cp docs/AGENT_API.md docs/ARCHITECTURE.md docs/RELEASING.md docs/ANDROID.md "dist/${package}/docs/"
          cp "docs/release-notes/${tag}.md" "dist/${package}/docs/release-notes/"
          cp web/reader/LICENSE "dist/${package}/web/reader/LICENSE"
          cp -R docs/images "dist/${package}/docs/"

          if [[ "${ARCHIVE}" == "zip" ]]; then
            (cd dist && zip -q -r "${package}.zip" "${package}")
          else
            tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: fake-komga-115-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  android:
    needs: prepare
    uses: ./.github/workflows/android-package.yml
    # Pass only these two names; the protected signing job resolves their values.
    secrets:
      ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
      ANDROID_SIGNING_STOREPASS: ${{ secrets.ANDROID_SIGNING_STOREPASS }}
    with:
      version-name: ${{ needs.prepare.outputs.android-version-name }}
      version-code: ${{ fromJSON(needs.prepare.outputs.android-version-code) }}
      reader-artifact: true

  release:
    needs: [build, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: fake-komga-115-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: mangaalpha-android-signed
          path: dist
      - name: Check release notes
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "${notes_file}" ]]; then
            echo "::error::Missing release notes file: ${notes_file}"
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=${notes_file}" >> "${GITHUB_ENV}"
      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum fake-komga-115_* mangaalpha-arm64.apk > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MangaAlpha ${GITHUB_REF_NAME}" \
            --notes-file "${RELEASE_NOTES_FILE}" \
            --verify-tag
