plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'io.github.xjogger.fakekomga115'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.xjogger.mangaalpha'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv("MANGAALPHA_VERSION_CODE") ?: "2050099").toInteger())
        versionName(System.getenv("MANGAALPHA_VERSION_NAME") ?: "2.5.0")
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation files('libs/fk115.aar') }
