services:
  fake-komga-115:
    image: blacktal/fake-komga-115:latest
    container_name: fake-komga-115
    restart: unless-stopped
    ports:
      - "25600:25600"
    environment:
      TZ: Asia/Shanghai
      FK115_HOST: 0.0.0.0
      FK115_PORT: "25600"
      FK115_DATA_DIR: /data
      FK115_OPEN_BROWSER: "false"
    volumes:
      - fake-komga-115-data:/data

volumes:
  fake-komga-115-data:
