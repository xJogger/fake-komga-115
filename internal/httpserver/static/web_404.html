<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>页面不存在 · MangaAlpha</title>
  <link id="app-favicon" rel="icon" type="image/png" href="/ui/mangaalpha-icon.png">
  <script>
    (function(){
      var mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');
      function sync(){
        try{
          var m=localStorage.getItem('fk115_theme_mode')||'auto';
          var dark=(m==='dark')||(m!=='light'&&mq&&mq.matches);
          var l=document.getElementById('app-favicon');
          if(l)l.href=dark?'/ui/mangaalpha-icon-dark.png':'/ui/mangaalpha-icon.png';
        }catch(e){}
      }
      sync();
      if(mq&&mq.addEventListener)mq.addEventListener('change',sync);
      window.addEventListener('storage',function(ev){if(!ev.key||ev.key==='fk115_theme_mode')sync();});
    })();
  </script>
  <link rel="stylesheet" href="/assets/web.css">
</head>
<body>
<main class="shell">
  <article class="card error-card">
    <div class="error-code">404</div>
    <h1>没有找到这个页面</h1>
    <p>漫画条目可能已被重新扫描、移动或删除。</p>
    <a class="button" href="/">返回书架</a>
  </article>
</main>
</body>
</html>
